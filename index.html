<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7X_SHOP.com - Modern E-Commerce Marketplace</title>
    <meta name="description" content="Premium full-featured e-commerce marketplace featuring English & Bangla support, Cash on Delivery, instant Telegram order notifications, customer portal, and comprehensive admin dashboard." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://7x-shop.com" />
    <meta property="og:title" content="7X_SHOP.com - Modern E-Commerce Marketplace" />
    <meta property="og:description" content="Shop the latest electronics, fashion, smartphones, home goods & trending deals with Cash on Delivery and fast doorstep shipping." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1472851294608-062f824d29cc?q=80&w=1200&auto=format&fit=crop" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="7X_SHOP.com - Modern E-Commerce Marketplace" />
    <meta name="twitter:description" content="Shop the latest electronics, fashion, smartphones, home goods & trending deals with Cash on Delivery and fast doorstep shipping." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1472851294608-062f824d29cc?q=80&w=1200&auto=format&fit=crop" />

    <!-- Google Fonts: Inter & Hind Siliguri for Bangla -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Schema.org Organization Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "7X_SHOP.com",
      "url": "https://7x-shop.com",
      "description": "Leading modern online marketplace offering tech gadgets, fashion, and home essentials with Cash on Delivery.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://7x-shop.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-amber-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
